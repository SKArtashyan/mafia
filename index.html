function heroHTML(r, me, act) {
  const ph = r.phase, round = ph.round;
  const steps = [['night', '🌙'], ['day', '☀️'], ['vote', '🗳️']];
  const stepper = r.status === 'playing' ? `<ol class="flex items-center gap-1 text-[11px] mb-3">${steps.map(([k, i], idx) =>
    `<li class="step ${ph.name === k ? 'step-on' : ''}" ${ph.name === k ? 'aria-current="step"' : ''}>${i}<span class="${ph.name === k ? '' : 'hidden sm:inline'}">${tE('step.' + k)}</span></li>${idx < 2 ? '<li class="step-line" aria-hidden="true"></li>' : ''}`).join('')}</ol>` : '';
  let icon = '', title = '', hint = '', queue = '';
  const sp = curSpeaker(r);
  if (r.status === 'ended') { icon = r.winner === 'town' ? '🎉' : '🔪'; title = tE(r.winner === 'town' ? 'win.town' : 'win.mafia'); hint = (me ? tE(teamOf(me.role) === r.winner ? 'win.yours' : 'win.lost') + ' ' : '') + tE('end.revealed'); }
  else if (!me) { title = tE('spect.t'); hint = tE('spect.d'); }
  else if (!me.alive) { title = tE('out.t'); hint = tE('out.d'); }
  else if (ph.name === 'day' && ph.turn) {
    if (!sp) { icon = '🎤'; title = tE('turn.starting'); hint = tE('an.turns', { s: r.settings.speakTime }); }
    else if (sp === me.id) { icon = '🎤'; title = tE('turn.you'); hint = tE('turn.youD'); }
    else { title = tE('turn.speaking', { name: nameOf(r, sp) }); hint = tE('turn.listen'); }
    queue = `<div class="flex items-center gap-2 overflow-x-auto quick pt-3 pb-1 px-1">${ph.turn.order.map((id, i) => {
      const p = r.players[id]; if (!p) return '';
      return `<div class="shrink-0 rounded-full ${i < ph.turn.idx || !p.alive ? 'q-done' : i === ph.turn.idx ? 'q-now' : ''}" title="${esc(p.name)}">${avatar(p.name, 'avatar-sm')}</div>`;
    }).join('')}</div>`;
  }
  else if (act) { icon = ROLE_META[me.role].icon; title = tE(act.k); hint = tE(act.k + 'D'); }
  else if (ph.name === 'night') { icon = '😴'; title = tE('sleep.t'); hint = tE('sleep.d'); }
  else if (ph.name === 'day') { title = tE('talk.t'); hint = tE('talk.d'); }
  else if (ph.name === 'vote') { title = tE('voting.t'); hint = tE('voting.d'); }
  const pr = me && r.private?.[me.id]?.[round];
  const notice = pr && ph.name !== 'night' ? `<div class="panel-soft p-3 mt-3 text-sm">${privateHTML(r, pr)}</div>` : '';
  return `<div class="panel p-4">${stepper}<div class="flex items-start gap-3">${icon ? `<div class="text-3xl leading-none pt-0.5">${icon}</div>` : ''}<div class="min-w-0"><h2 class="font-display text-[1.7rem] leading-tight">${title}</h2><p class="muted text-sm mt-0.5 leading-snug">${hint}</p></div></div>${notice}${queue}</div>`;
}

function seatFlags(r, me, act, players) {
  const ph = r.phase, round = ph.round, votes = r.votes?.[round] || {};
  const notes = {}; Object.values((me && r.private?.[me.id]) || {}).forEach(x => notes[x.target] = x);
  const sp = curSpeaker(r), out = {}, nextPrev = {};
  for (const p of players) {
    const vc = ph.name === 'vote' ? tallyOf(votes, p.id) : 0, prev = S.prevSeat[p.id];
    out[p.id] = {
      role: visibleRole(r, me, p), can: !!(act && act.can(p)), picked: !!(act && act.current === p.id), vc,
      justDied: !!(prev && prev.alive && !p.alive), vcPop: !!(prev && prev.vc !== vc && vc > 0), note: notes[p.id], speaking: sp === p.id
    };
    nextPrev[p.id] = { alive: p.alive, vc };
  }
  S.prevSeat = nextPrev;
  return out;
}

function feltHTML(r) {
  const ph = r.phase;
  if (r.status === 'ended') return `<div class="felt-ico">${r.winner === 'town' ? '🎉' : '🔪'}</div><div class="font-display text-xl leading-tight mt-1">${tE(r.winner === 'town' ? 'win.town' : 'win.mafia')}</div>`;
  const sp = curSpeaker(r);
  if (sp) { const nm = nameOf(r, sp); return `${avatar(nm, 'avatar-lg')}<div class="font-semibold text-sm mt-1 truncate max-w-full">${esc(nm)}</div><span class="eq my-1"><span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span></span><div id="ctimer" class="ctimer !text-xl"></div>`; }
  const icon = { night: '🌙', day: '☀️', vote: '🗳️' }[ph.name] || '🌙';
  let sub = tE(ph.name === 'night' ? 'ph.night' : 'ph.day', { n: ph.round });
  if (ph.name === 'vote') { const v = r.votes?.[ph.round] || {}, alive = plist(r).filter(p => p.alive); sub = tE('act.voted', { a: Object.keys(v).filter(id => r.players[id]?.alive).length, b: alive.length }); }
  return `<div class="felt-ico" data-k="${ph.name}${ph.round}">${icon}</div><div id="ctimer" class="ctimer"></div><div class="text-[11px] muted leading-tight">${sub}</div>`;
}

function tableHTML(r, me, act, players, F) {
  const n = players.length, seat = n <= 6 ? 62 : n <= 9 ? 54 : n <= 12 ? 47 : 41, R = 39;
  const pos = {};
  players.forEach((p, i) => { const a = (-90 + i * 360 / n) * Math.PI / 180; pos[p.id] = [50 + R * Math.cos(a), 50 + R * Math.sin(a)]; });
  const ph = r.phase, round = ph.round;
  let pairs = [], kind = null;
  if (ph.name === 'vote') { kind = 'vote'; pairs = Object.entries(r.votes?.[round] || {}).filter(([v, tg]) => r.players[v]?.alive && pos[v] && pos[tg]); }
  else if (ph.name === 'night' && me?.alive && teamOf(me.role) === 'mafia') { kind = 'kill'; pairs = Object.entries(r.night?.[round]?.kill || {}).filter(([v, tg]) => pos[v] && pos[tg]); }
  const gap = (seat / 2 + 6) / (S.tableW || 360) * 100;
  const lines = pairs.map(([v, tg]) => {
    const [x1, y1] = pos[v], [x2, y2] = pos[tg], dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
    const sx = x1 + dx / d * gap, sy = y1 + dy / d * gap, ex = x2 - dx / d * gap, ey = y2 - dy / d * gap;
    const mx = (sx + ex) / 2 + (50 - (sx + ex) / 2) * .35, my = (sy + ey) / 2 + (50 - (sy + ey) / 2) * .35;
    const isNew = !S.prevLines.has(v + '>' + tg);
    return `<path class="${kind} ${isNew ? 'draw' : ''}" d="M${sx.toFixed(2)} ${sy.toFixed(2)} Q${mx.toFixed(2)} ${my.toFixed(2)} ${ex.toFixed(2)} ${ey.toFixed(2)}" marker-end="url(#arrow-${kind})"/>`;
  }).join('');
  S.prevLines = new Set(pairs.map(([v, tg]) => v + '>' + tg));
  const entering = S.tableGame !== r.gameId; S.tableGame = r.gameId;
  const reveal = r.status === 'ended' && S.revealedGame !== r.gameId; if (r.status === 'ended') S.revealedGame = r.gameId;
  const seats = players.map((p, i) => {
    const f = F[p.id], [x, y] = pos[p.id];
    const cls = ['tseat', !p.alive && 'dead', me && p.id === me.id && 'me', act && (f.can ? 'pickable' : 'unpick'), f.picked && 'picked', f.speaking && 'speaking', f.justDied && 'just-died', (entering || reveal) && 'seat-in', !p.online && p.alive && 'away'].filter(Boolean).join(' ');
    const rb = f.role ? `<span class="rb ${teamOf(f.role) === 'mafia' ? 'rb-m' : ''}">${ROLE_META[f.role].icon}</span>` : '';
    const nb = f.note ? `<span class="nb ${f.note.yes ? 'yes' : 'no'}">${f.note.yes ? '!' : '✓'}</span>` : '';
    const vb = f.vc ? `<span class="vb ${f.vcPop ? 'vc-pop' : ''}">${f.vc}</span>` : '';
    return `<button class="${cls}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;--i:${i}" data-seat="${p.id}" aria-label="${esc(p.name)}"><span class="av" style="background:hsl(${hue(p.name)} 45% 45%)"><span class="ini">${esc([...p.name.trim()][0]?.toUpperCase() || '?')}</span>${vb}${rb}${nb}</span><span class="nm">${p.bot ? '🤖' : ''}${esc(p.name)}</span></button>`;
  }).join('');
  return `<div class="table-wrap"><div class="table" style="--seat:${seat}px">
    <div class="felt ${lines ? 'see' : ''}">${feltHTML(r)}</div>
    <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <marker id="arrow-vote" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>
        <marker id="arrow-kill" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--danger)"/></marker>
      </defs>${lines}</svg>
    ${seats}
  </div></div>`;
}

function listHTML(r, me, act, players, F) {
  const ph = r.phase, votes = r.votes?.[ph.round] || {}, n = r.night?.[ph.round] || {};
  return `<div class="grid grid-cols-2 gap-2.5">${players.map((p, i) => {
    const f = F[p.id];
    const voters = ph.name === 'vote' ? Object.entries(votes).filter(([v, tg]) => tg === p.id && r.players[v]?.alive).map(([v]) => nameOf(r, v)) : [];
    const picks = (ph.name === 'night' && me && teamOf(me.role) === 'mafia' && me.alive) ? Object.entries(n.kill || {}).filter(([, tg]) => tg === p.id).map(([v]) => nameOf(r, v)) : [];
    const cls = ['seat', !p.alive && 'dead', act && !f.can && 'unpick', f.picked && 'picked', f.speaking && 'speaking', f.justDied && 'shake'].filter(Boolean).join(' ');
    const status = p.alive ? (f.speaking ? '🎤 ' + tE('seat.speaking') : tE(p.online ? 'seat.alive' : 'seat.away')) : tE(p.diedAt?.how === 'vote' ? 'seat.outVote' : 'seat.outNight');
    return `<button class="${cls}" data-seat="${p.id}" aria-label="${esc(p.name)}">
      ${f.vc ? `<span class="votecount ${f.vcPop ? 'vc-pop' : ''}">${f.vc}</span>` : ''}
      <div class="flex items-center gap-2.5">${p.alive ? avatar(p.name) : `<div class="avatar" style="background:var(--surface2)">💀</div>`}
        <div class="min-w-0"><div class="seat-name font-semibold truncate">${esc(p.name)}${me && p.id === me.id ? ` <span class="muted font-normal text-xs">${tE('you')}</span>` : ''}</div><div class="text-[11px] muted truncate">${p.bot ? '🤖 ' : ''}${status}</div></div></div>
      <div class="flex flex-wrap gap-1 mt-2 min-h-[1.25rem]">
        ${f.role ? `<span class="chip ${teamOf(f.role) === 'mafia' ? 'chip-danger' : ''}">${esc(roleText(f.role))}</span>` : ''}
        ${f.note ? `<span class="chip ${f.note.yes ? 'chip-danger' : 'chip-good'}">${tE(f.note.kind === 'det' ? (f.note.yes ? 'chip.mafia' : 'chip.notMafia') : (f.note.yes ? 'chip.det' : 'chip.notDet'))}</span>` : ''}
        ${picks.length ? `<span class="chip chip-danger">🔪 ${picks.map(esc).join(', ')}</span>` : ''}
      </div>
      ${voters.length ? `<div class="flex items-center mt-1.5 -space-x-1.5">${voters.slice(0, 6).map(v => avatar(v, 'avatar-xs')).join('')}</div>` : ''}
    </button>`;
  }).join('')}</div>`;
}

function gameHTML() {
  const r = S.room, me = getMe(), act = getAction(r, me), players = plist(r), alive = players.filter(p => p.alive);
  const F = seatFlags(r, me, act, players);
  return `<div class="space-y-3">
    ${heroHTML(r, me, act)}
    <div class="flex items-center justify-between px-1">
      <span class="muted text-xs">${tE('aliveOut', { a: alive.length, b: players.length - alive.length })}</span>
      <div class="seg"><button data-act="view" data-v="table" aria-pressed="${S.view === 'table'}">⭕ ${tE('view.table')}</button><button data-act="view" data-v="list" aria-pressed="${S.view === 'list'}">☰ ${tE('view.list')}</button></div>
    </div>
    ${S.view === 'table' ? tableHTML(r, me, act, players, F) : listHTML(r, me, act, players, F)}
  </div>`;
}

async function onMainClick(e) {
  const r = S.room; if (!r) return;
  const tg = e.target.closest('[data-act],[data-seat]'); if (!tg) return;
  if (tg.dataset.seat) { vibrate(10); openPlayer(tg.dataset.seat); return; }
  const a = tg.dataset.act;
  if (a === 'copy') copyLink();
  if (a === 'share') shareInvite();
  if (a === 'qr') showQR();
  if (a === 'view') { S.view = tg.dataset.v; localStorage.setItem('nf_view', S.view); S.tableGame = null; renderMain(); }
  if (a === 'settings') { S.settingsOpen = !S.settingsOpen; renderMain(); }
  if (a === 'addbot') await addBots(1);
  if (a === 'fillbots') await addBots(99);
  if (a === 'clearbots') await removeBots();
  if (a === 'seat') {
    const name = (S.name || prompt(t('yourName')) || '').trim().slice(0, 16);
    if (name) { try { await joinRoom(S.code, name); } catch (err) { toast(typeof err === 'string' ? err : t('err.join')); } }
  }
}
async function onMainChange(e) {
  const el = e.target.closest('[data-setting]'); if (!el || !isHost()) return;
  const key = el.dataset.setting, val = el.type === 'checkbox' ? el.checked : +el.value;
  if (key === 'maxPlayers' && val < plist(S.room).length) { toast(t('tooMany')); el.blur(); renderMain(); return; }
  el.blur();
  await S.roomRef.child('settings/' + key).set(val);
  if (key === 'test' && val) toast(t('testOn'), 3500);
}

/* ---------- Test dock ---------- */
function renderTestDock() {
  const dock = $('#testDock'), r = S.room;
  const show = S.screen === 'room' && r?.settings?.test && isHost();
  dock.classList.toggle('hidden', !show);
  $('#testHdr')?.classList.toggle('hidden', !show);
  if (!show) return;
  const panel = $('#testPanel');
  panel.classList.toggle('hidden', !S.testOpen);
  if (!S.testOpen) return;
  if (panel.contains(document.activeElement) && document.activeElement.tagName === 'SELECT') return;
  const me = getMe(), playing = r.status === 'playing';
  panel.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-display text-2xl leading-none">${tE('test.title')}</h3>
      <button class="btn btn-ghost btn-icon !w-8 !h-8 text-sm" data-t="close" aria-label="${tE('close')}">✕</button>
    </div>
    <p class="muted text-xs mb-3">${tE('test.only')}</p>
    <label class="block text-sm"><span class="muted">${tE('test.as')}</span>
      <select class="field !py-2 mt-1" data-t="viewas">${plist(r).map(p => `<option value="${p.id}" ${me?.id === p.id ? 'selected' : ''}>${esc(p.name)}${p.id === S.pid ? ' ' + tE('you') : p.bot ? ' 🤖' : ''}${p.role ? `, ${esc(roleName(p.role))}` : ''}${p.alive === false ? tE('test.outS') : ''}</option>`).join('')}</select></label>
    <label class="flex items-center justify-between gap-3 text-sm mt-3"><span>${tE('test.roles')}</span><input type="checkbox" class="w-5 h-5" style="accent-color:var(--accent)" data-t="reveal" ${S.revealAll ? 'checked' : ''}></label>
    ${playing ? `<div class="grid grid-cols-2 gap-2 mt-4">
      <button class="btn btn-ghost btn-sm" data-t="rush">${tE('test.rush')}</button>
      <button class="btn btn-ghost btn-sm" data-t="skip">${tE('test.next')}</button>
      <button class="btn btn-ghost btn-sm" data-t="extend">⏱️ ${tE('add30')}</button>
      <button class="btn btn-ghost btn-sm" data-t="role">${tE('test.role')}</button>
    </div>` : `<div class="grid grid-cols-2 gap-2 mt-4">
      <button class="btn btn-ghost btn-sm" data-t="addbot">${tE('addBot')}</button>
      <button class="btn btn-ghost btn-sm" data-t="fill">${tE('fill')}</button>
    </div>`}`;
}
$('#testBtn').onclick = () => { S.testOpen = !S.testOpen; renderTestDock(); };
$('#testPanel').addEventListener('click', async e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  const a = b.dataset.t, r = S.room;
  if (a === 'close') { S.testOpen = false; renderTestDock(); }
  if (a === 'rush') { const k = `${r.gameId}-${r.phase.name}-${r.phase.round}`; S.botRush = r.phase.turn ? k + '-' + r.phase.turn.idx : k; toast(t('test.rushing')); }
  if (a === 'skip') { if (r.phase.turn && curSpeaker(r)) await finishTurn(); else await endPhaseNow(); }
  if (a === 'extend') await extendPhase(30);
  if (a === 'role') showRoleCard(false);
  if (a === 'addbot') await addBots(1);
  if (a === 'fill') await addBots(99);
});
$('#testPanel').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.t === 'viewas') {
    S.viewId = el.value === S.pid ? null : el.value; S.prevMe = null; S.donMode = 'kill'; el.blur();
    const me = getMe(); toast(t('test.now', { name: me?.name }) + (me?.role ? ` (${roleName(me.role)})` : ''));
    renderHeader(); renderMain(); renderChat(); renderTestDock();
  }
  if (el.dataset.t === 'reveal') { S.revealAll = el.checked; renderMain(); }
});

/* ---------- Log ---------- */
function logText(x) {
  if (!x.k) return x.text || '';
  const v = { ...(x.v || {}) };
  if (x.k === 'vote') return '⚖️ ' + voteMsg(v);
  if (x.k === 'start') v.roles = roleSummary(v.n, S.room.settings);
  let s = t('log.' + x.k, v);
  if (x.k === 'killed' && v.role) s += ' ' + t('reveal', { role: roleText(v.role) });
  return s;
}
function renderLog() {
  const el = $('#logList'); if (!el) return;
  const entries = Object.entries(S.room.log || {}).sort((a, b) => b[1].t - a[1].t);
  const first = S.seenLog.size === 0;
  el.innerHTML = entries.map(([k, x]) => {
    const isNew = !first && !S.seenLog.has(k); S.seenLog.add(k);
    return `<li class="tl tl-${x.type || 'info'} ${isNew ? 'msg-in' : ''}"><span class="tl-dot"></span><span class="tl-txt">${esc(logText(x))}</span></li>`;
  }).join('');
}

/* ---------- Chat, emoji, GIFs, reactions ---------- */
function chatChannel() {
  const r = S.room, me = getMe(); if (!r) return null;
  if (!me) return r.status === 'playing' ? 'dead' : null;
  if (r.status !== 'playing') return 'all';
  if (!me.alive) return 'dead';
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' ? 'mafia' : null;
  const sp = curSpeaker(r);
  if (sp && sp !== me.id) return null;
  return 'all';
}
function reactChannel() {
  const r = S.room, me = getMe(); if (!r) return null;
  if (r.status !== 'playing') return 'all';
  if (!me) return 'dead';
  if (!me.alive) return 'dead';
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' ? 'mafia' : null;
  return 'all';
}
function canSee(m) {
  const r = S.room, me = getMe(); if (!r) return false;
  if (m.ch === 'all' || r.status !== 'playing') return true;
  if (m.g !== r.gameId) return false;
  if (!me) return m.ch === 'dead';
  if (!me.alive) return true;
  if (m.ch === 'mafia') return teamOf(me.role) === 'mafia';
  return false;
}
function scrollChat(force) { const el = $('#chatList'); if (el && (force || el.scrollHeight - el.scrollTop - el.clientHeight < 140)) el.scrollTop = el.scrollHeight; }
function renderChat() {
  const el = $('#chatList'); if (!el || !S.room) return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
  const me = getMe(), day = document.body.classList.contains('theme-day');
  const msgs = S.chat.filter(canSee);
  el.innerHTML = msgs.length ? msgs.map(m => {
    const mine = me && m.pid === me.id;
    const fresh = m.t > S.enterAt - 1000 && now() - m.t < 4000;
    const tag = m.ch === 'mafia' ? `<span class="chip chip-danger !py-0 mr-1">🔪</span>` : m.ch === 'dead' ? '<span class="chip !py-0 mr-1">👻</span>' : '';
    const time = m.t ? new Date(m.t).toLocaleTimeString(LANG === 'hy' ? 'hy-AM' : [], { hour: '2-digit', minute: '2-digit' }) : '';
    const body = isGifUrl(m.gif) ? `<img class="gif-msg" src="${esc(m.gif)}" alt="GIF" loading="lazy">` : `<span class="break-words">${esc(m.text)}</span>`;
    return `<div class="rounded-xl px-2.5 py-1.5 ${m.ch === 'mafia' ? 'msg-mafia' : m.ch === 'dead' ? 'msg-dead' : ''} ${fresh ? 'msg-in' : ''}">
      ${tag}<span class="font-semibold" style="color:hsl(${hue(m.name)} 55% ${day ? '35%' : '72%'})">${esc(m.name)}${mine ? ' ' + tE('you') : ''}</span>
      <span class="muted text-[10px] ml-1">${time}</span> ${body}</div>`;
  }).join('') : `<div class="text-center py-10 muted"><div class="text-3xl mb-2">💬</div>${tE('chat.empty')}</div>`;
  if (near) el.scrollTop = el.scrollHeight;
  const ch = chatChannel(), input = $('#chatInput'), badge = $('#chatChannel'), r = S.room, sp = curSpeaker(r);
  const labels = { all: ['chat.all', 'chip-accent'], mafia: ['chat.mafia', 'chip-danger'], dead: ['chat.dead', ''] };
  input.disabled = !ch;
  document.querySelectorAll('[data-pick-open]').forEach(b => b.disabled = !ch);
  if (!ch && S.picker) closePicker();
  input.placeholder = !ch ? (r.status === 'playing' ? (sp ? t('chat.phTurn', { name: nameOf(r, sp) }) : t('chat.phNight')) : t('chat.phJoin'))
    : ch === 'mafia' ? t('chat.phMafia') : ch === 'dead' ? t('chat.phDead') : t('chat.ph');
  badge.textContent = ch ? t(labels[ch][0]) : t('chat.closed');
  badge.className = 'chip ' + (ch ? labels[ch][1] : '');
  $('#quick').innerHTML = ch === 'all' ? t('quick').map(q => `<button class="chip !text-xs !py-1.5 !px-3 shrink-0" data-q="${esc(q)}">${esc(q)}</button>`).join('') : '';
}
async function sendChat(raw, gif) {
  const text = (raw || '').trim(), ch = chatChannel(); if ((!text && !gif) || !ch) return;
  const me = getMe();
  if (!gif && raw === $('#chatInput').value) $('#chatInput').value = '';
  const msg = { pid: me?.id || S.pid, name: me?.name || S.name || 'Guest', text: (text || 'GIF').slice(0, 300), t: TS, ch, g: S.room.gameId || 0 };
  if (gif) msg.gif = gif;
  await db.ref('chats/' + S.code).push(msg);
  scrollChat(true);
}
function sendReaction(e) {
  const ch = reactChannel(); if (!ch || !S.code) return;
  if (Date.now() - S.lastReact < 700) return; S.lastReact = Date.now();
  const me = getMe();
  vibrate(15);
  db.ref('reactions/' + S.code).push({ pid: me?.id || S.pid, name: me?.name || S.name || '?', e, t: TS, ch, g: S.room?.gameId || 0 });
}
function togglePicker(mode) { if (S.picker === mode) return closePicker(); S.picker = mode; renderPicker(); }
function closePicker() { S.picker = null; $('#picker')?.classList.add('hidden'); }
function renderPicker() {
  const p = $('#picker'); if (!p) return;
  p.classList.remove('hidden');
  if (S.picker === 'emoji') {
    const cat = S.emojiCat || Object.keys(EMOJI)[0];
    p.innerHTML = `
      <div class="flex gap-1 mb-2">${Object.keys(EMOJI).map(k => `<button type="button" class="btn btn-ghost btn-icon !w-9 !h-9 ${k === cat ? 'btn-on' : ''}" data-ecat="${k}">${k}</button>`).join('')}
        <button type="button" class="btn btn-ghost btn-icon !w-9 !h-9 ml-auto" data-pclose aria-label="${tE('close')}">✕</button></div>
      <div class="grid grid-cols-8 gap-0.5 max-h-48 overflow-y-auto scroll-thin">${EMOJI[cat].split(' ').map(e => `<button type="button" class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}</div>`;
  } else {
    p.innerHTML = `
      <div class="flex gap-2 mb-2"><input id="gifQuery" class="field !py-2 text-sm" placeholder="${tE('gif.search')}" autocomplete="off">
        <button type="button" class="btn btn-ghost btn-icon shrink-0" data-pclose aria-label="${tE('close')}">✕</button></div>
      <div id="gifGrid" class="gif-grid max-h-64 overflow-y-auto scroll-thin"></div>
      <p class="text-[10px] muted mt-1 text-right">${tE('gif.by')}</p>`;
    loadGifs('');
    setTimeout(() => $('#gifQuery')?.focus(), 30);
  }
}
async function loadGifs(q) {
  const box = $('#gifGrid'); if (!box) return;
  if (!GIPHY_API_KEY) { box.style.columns = '1'; box.innerHTML = `<p class="muted text-sm p-2">${tE('gif.noKey')}</p>`; return; }
  box.innerHTML = '<div class="grid place-items-center py-6" style="column-span:all"><div class="spinner"></div></div>';
  const base = 'https://api.giphy.com/v1/gifs/';
  const url = q ? `${base}search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(q)}&limit=24&rating=pg-13&lang=${LANG === 'hy' ? 'hy' : 'en'}` : `${base}trending?api_key=${GIPHY_API_KEY}&limit=24&rating=pg-13`;
  try {
    const res = await fetch(url); const data = await res.json();
    S.gifs = (data.data || []).map(g => ({ prev: g.images?.fixed_width_small?.url || g.images?.fixed_width?.url, url: g.images?.fixed_height?.url || g.images?.downsized?.url, title: g.title })).filter(g => isGifUrl(g.url) && isGifUrl(g.prev));
    if (!$('#gifGrid')) return;
    $('#gifGrid').innerHTML = S.gifs.length ? S.gifs.map((g, i) => `<button type="button" data-gif="${i}" title="${esc(g.title)}"><img src="${esc(g.prev)}" alt="${esc(g.title)}" loading="lazy"></button>`).join('') : `<p class="muted text-sm p-2">${tE('gif.none')}</p>`;
  } catch (e) { console.error(e); if ($('#gifGrid')) $('#gifGrid').innerHTML = `<p class="muted text-sm p-2">${tE('gif.err')}</p>`; }
}
function onPickerClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pclose !== undefined) return closePicker();
  if (b.dataset.ecat) { S.emojiCat = b.dataset.ecat; renderPicker(); return; }
  if (b.dataset.emoji) {
    const inp = $('#chatInput'); const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, st) + b.dataset.emoji + inp.value.slice(en);
    inp.focus(); const pos = st + b.dataset.emoji.length; inp.setSelectionRange(pos, pos); return;
  }
  if (b.dataset.gif !== undefined) { const g = S.gifs[+b.dataset.gif]; if (g) { sendChat('GIF', g.url); closePicker(); } }
}

/* =====================================================================
   10. BOOT
   ===================================================================== */
(async function boot() {
  document.documentElement.lang = LANG;
  if (!CONFIGURED) return renderSetupNeeded();
  db.ref('.info/serverTimeOffset').on('value', s => S.offset = s.val() || 0);
  setInterval(() => { updateTimer(); engineTick(); }, 500);
  const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  if (!code) return renderHome();
  try {
    if ((await db.ref(`rooms/${code}/players/${S.pid}/name`).once('value')).exists()) return enterRoom(code);
    if (!(await db.ref(`rooms/${code}/status`).once('value')).exists()) return renderHome('', t('err.noRoom'));
    renderHome(code);
  } catch (e) { console.error(e); renderHome(code, t('err.db')); }
})();
</script>
