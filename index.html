<style>
  /* ================= Theme tokens ================= */
  :root, .theme-night {
    --bg: #1a1530; --bg2: #0f0c1f; --surface: #241d40; --surface2: #2e2652;
    --line: rgba(233,228,255,.12); --text: #ece8ff; --muted: #a59fc6;
    --accent: #f2c14e; --accent-ink: #1a1530; --danger: #e05a6f; --good: #6fd3a8;
  }
  .theme-day {
    --bg: #dfe9f2; --bg2: #c9dbea; --surface: #ffffff; --surface2: #eef4f9;
    --line: rgba(29,42,58,.12); --text: #1d2a3a; --muted: #5b6b7e;
    --accent: #1f6f78; --accent-ink: #ffffff; --danger: #c43c52; --good: #1f8a5b;
  }
  .theme-vote { --accent: #b8325a; --accent-ink: #fff; }
  .theme-blood {
    --bg: #1c0f16; --bg2: #10080c; --surface: #2a1520; --surface2: #361b29;
    --line: rgba(255,220,230,.12); --text: #fbe9ef; --muted: #c49aa8;
    --accent: #e05a6f; --accent-ink: #1c0f16; --danger: #ff7b8f; --good: #6fd3a8;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg2); color: var(--text);
    font-family: Figtree, "Noto Sans Armenian", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body, .panel, .panel-soft, .seat, .hdr, .field, .chip, .btn, .tile { transition: background-color .9s ease, color .9s ease, border-color .9s ease, transform .1s, filter .15s, box-shadow .2s; }

  /* ================= Sky ================= */
  #sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #sky > div { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease; }
  .sky-night { background: radial-gradient(1200px 600px at 85% -10%, #3b2f6e 0%, transparent 60%), linear-gradient(180deg, #1a1530 0%, #0f0c1f 100%); }
  .sky-day   { background: radial-gradient(1000px 500px at 85% -10%, #fff6d8 0%, transparent 55%), linear-gradient(180deg, #e7f0f8 0%, #c9dbea 100%); }
  .sky-blood { background: radial-gradient(1000px 500px at 85% -10%, #5a1f33 0%, transparent 60%), linear-gradient(180deg, #1c0f16, #10080c); }
  .theme-night .sky-night, .theme-day .sky-day, .theme-blood .sky-blood { opacity: 1; }
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.8s; }
  .theme-night #stars, .theme-blood #stars { opacity: .75; }
  #orb { position: fixed; top: 96px; right: 7%; width: 76px; height: 76px; z-index: 0; pointer-events: none; }
  #orb > div { position: absolute; inset: 0; border-radius: 50%; transition: transform 1.8s cubic-bezier(.45,0,.2,1), opacity 1.4s ease, background 1.2s, box-shadow 1.2s; }
  #orb .moon { background: radial-gradient(circle at 62% 38%, rgba(0,0,0,.08) 0 9%, transparent 10%), radial-gradient(circle at 38% 62%, rgba(0,0,0,.07) 0 6%, transparent 7%), radial-gradient(circle at 35% 35%, #fffbe8, #e9dfb8 60%, #cfc39a); box-shadow: 0 0 60px 12px rgba(242,193,78,.16); }
  #orb .sun { background: radial-gradient(circle, #fff7d1 0%, #ffd66b 55%, #ffb547 100%); box-shadow: 0 0 80px 30px rgba(255,200,90,.45); transform: translateY(160px) scale(.7); opacity: 0; animation: glow 6s ease-in-out infinite; }
  .theme-day #orb .moon { transform: translateY(160px) scale(.7); opacity: 0; }
  .theme-day #orb .sun { transform: none; opacity: 1; }
  .theme-blood #orb .moon { background: radial-gradient(circle at 35% 35%, #ffc2c2, #c0392b 70%); box-shadow: 0 0 70px 16px rgba(224,90,111,.35); }
  @keyframes glow { 50% { box-shadow: 0 0 110px 44px rgba(255,200,90,.55); } }
  @media (max-width: 640px) { #orb { width: 54px; height: 54px; top: 84px; right: 5%; opacity: .7; } }

  /* ================= Components ================= */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
  .panel-soft { background: var(--surface2); border-radius: 14px; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .hdr { background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.45rem; border-radius:999px; padding:.7rem 1.25rem; font-weight:600; position: relative; white-space: nowrap; }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding:.4rem .85rem; font-size:.85rem; }
  .btn-icon { width: 38px; height: 38px; padding: 0; font-size: 1.05rem; }
  .btn-on { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); }
  .field { width:100%; background: var(--surface2); border:1px solid var(--line); color: var(--text); border-radius: 14px; padding:.8rem 1rem; outline: none; }
  .field::placeholder { color: var(--muted); }
  .field:focus { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { background: var(--accent); transition: width .5s ease; }
  .chip { display:inline-flex; align-items:center; gap:.3rem; font-size:.72rem; font-weight:600; padding:.15rem .55rem; border-radius:999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
  .chip-accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .chip-danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .chip-good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .avatar { width: 42px; height: 42px; border-radius: 999px; display:grid; place-items:center; font-weight:700; color:#fff; flex-shrink:0; }
  .avatar-xs { width: 20px; height: 20px; font-size: .6rem; border: 2px solid var(--surface); }
  .avatar-sm { width: 30px; height: 30px; font-size: .8rem; }
  .avatar-lg { width: 64px; height: 64px; font-size: 1.6rem; }
  .avatar-xl { width: 88px; height: 88px; font-size: 2.2rem; }

  /* Seats */
  .seat { position:relative; text-align:left; background: var(--surface); border:1px solid var(--line); border-radius: 18px; padding: .8rem; }
  .seat.pickable { cursor:pointer; }
  .seat.pickable:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); transform: translateY(-2px); }
  .seat.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .seat.picked::after { content:''; position:absolute; inset:-4px; border-radius: 22px; border: 2px solid var(--accent); animation: ring 1.6s ease-out infinite; pointer-events:none; }
  .seat.speaking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset, 0 8px 30px color-mix(in srgb, var(--accent) 25%, transparent); }
  .seat.dead { opacity:.55; filter: grayscale(.8); }
  .seat.dead .seat-name { text-decoration: line-through; text-decoration-thickness: 1px; }
  .seat.dimmed { opacity: .5; }
  .votecount { position:absolute; top:-9px; right:-9px; min-width:28px; height:28px; padding:0 7px; border-radius:999px; background: var(--accent); color: var(--accent-ink); font-weight:700; display:grid; place-items:center; font-size:.85rem; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .eq { display:inline-flex; align-items:flex-end; gap:2px; height: 12px; }
  .eq span { width:3px; height:100%; background: var(--accent); border-radius:2px; transform-origin: bottom; animation: eq .9s ease-in-out infinite; animation-delay: calc(var(--i) * .15s); }
  .step { display:flex; align-items:center; gap:.35rem; padding:.3rem .7rem; border-radius:999px; color: var(--muted); font-weight:600; }
  .step-on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .step-line { flex:1; height:1px; background: var(--line); min-width: 10px; }
  .q-done { opacity: .35; }
  .q-now { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.12); }

  /* Call tiles */
  .tile { position: relative; aspect-ratio: 4/3; border-radius: 14px; overflow: hidden; background: var(--surface2); }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.self video { transform: scaleX(-1); }
  .tile:not(.has-video) video { opacity: 0; position: absolute; inset: 0; }
  .tile-av { position: absolute; inset: 0; display: grid; place-items: center; }
  .tile.has-video .tile-av { display: none; }
  .tile-name { position: absolute; left: 6px; bottom: 6px; right: 6px; font-size: .7rem; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-sleep { position: absolute; inset: 0; display: none; place-items: center; font-size: 1.6rem; background: color-mix(in srgb, var(--bg2) 85%, transparent); }
  .tile.blocked .tile-sleep { display: grid; }
  .tile.blocked video { visibility: hidden; }
  .tile.talking { box-shadow: 0 0 0 3px var(--good); }

  /* Chat */
  .msg-mafia { background: color-mix(in srgb, var(--danger) 14%, transparent); }
  .msg-dead { background: color-mix(in srgb, var(--muted) 14%, transparent); font-style: italic; }
  .quick { scrollbar-width: none; } .quick::-webkit-scrollbar { display:none; }
  .gif-msg { max-width: 220px; max-height: 180px; border-radius: 12px; margin-top: .3rem; display: block; }
  #picker { position: absolute; left: .75rem; right: .75rem; bottom: 100%; margin-bottom: .5rem; z-index: 20; box-shadow: 0 16px 40px rgba(0,0,0,.3); }
  .emoji-btn { font-size: 1.45rem; line-height: 1; padding: .3rem; border-radius: 10px; }
  .emoji-btn:hover { background: var(--surface2); transform: scale(1.15); }
  .gif-grid { columns: 3; column-gap: .4rem; }
  .gif-grid button { display: block; width: 100%; margin-bottom: .4rem; border-radius: 10px; overflow: hidden; break-inside: avoid; background: var(--surface2); }
  .gif-grid img { width: 100%; display: block; }
  .floater { position: fixed; z-index: 65; pointer-events: none; display: flex; flex-direction: column; align-items: center; animation: floatUp 3.4s cubic-bezier(.2,.7,.3,1) forwards; }
  .floater .e { font-size: 2.6rem; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
  .floater .n { font-size: .65rem; font-weight: 700; padding: .05rem .4rem; border-radius: 999px; background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  @keyframes floatUp { 0% { opacity:0; transform: translateY(0) scale(.5); } 12% { opacity:1; transform: translateY(-30px) scale(1.15); } 100% { opacity:0; transform: translate(var(--dx), -58vh) scale(.9) rotate(var(--rot)); } }

  /* Role card */
  .card-wrap { perspective: 1200px; }
  .card { position:relative; width: min(280px, 78vw); aspect-ratio: 5/7; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 1.5rem; text-align:center; overflow: hidden; }
  .card-back { background: repeating-linear-gradient(45deg, #2e2652 0 10px, #241d40 10px 20px); border: 2px solid #f2c14e; color:#f2c14e; }
  .card-back::before { content:''; position:absolute; inset:0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%); transform: translateX(-100%); animation: shimmer 2.6s ease-in-out infinite; }
  .card-front { transform: rotateY(180deg); background: #f8f5ec; color: #1a1530; border: 2px solid #1a1530; }
  .card-front.mafia { background: #2a1520; color: #fbe9ef; border-color: #e05a6f; }

  #timerWrap.urgent { animation: beat 1s ease-in-out infinite; }
  #ring { transition: stroke-dashoffset .5s linear, stroke .3s; }
  #overlay { background: color-mix(in srgb, var(--bg2) 72%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #overlay.show { animation: fade .3s ease-out; }
  #testDock .panel { box-shadow: 0 12px 40px rgba(0,0,0,.35); }

  /* ================= Motion ================= */
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes pop { 0% { opacity:0; transform: scale(.6); } 70% { transform: scale(1.06); } 100% { opacity:1; transform: scale(1); } }
  @keyframes letterIn { from { opacity:0; transform: translateY(.4em) rotate(4deg); filter: blur(4px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes iconIn { 0% { opacity:0; transform: scale(.3) rotate(-25deg); } 70% { transform: scale(1.12) rotate(4deg); } 100% { opacity:1; transform:none; } }
  @keyframes die { 0% { transform:none; filter:none; opacity:1; } 15% { transform: translateX(-5px) rotate(-1.5deg); } 30% { transform: translateX(5px) rotate(1.5deg); } 45% { transform: translateX(-3px); } 60% { transform: none; filter: grayscale(0); opacity:1; } 100% { filter: grayscale(.8); opacity:.55; } }
  @keyframes dieBig { 0% { filter:none; transform: scale(1); } 20% { transform: scale(1.08); } 35% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 65% { transform: none; filter:none; } 100% { filter: grayscale(1) brightness(.6); transform: scale(.94); } }
  @keyframes shield { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--good) 0%, transparent); } }
  @keyframes ring { 0% { opacity:.85; transform: scale(1); } 100% { opacity:0; transform: scale(1.06); } }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } }
  @keyframes shimmer { 0%, 30% { transform: translateX(-100%); } 70%, 100% { transform: translateX(100%); } }
  @keyframes zzz { 0% { opacity:0; transform: translate(0,8px) scale(.7); } 40% { opacity:1; } 100% { opacity:0; transform: translate(18px,-22px) scale(1.25); } }
  @keyframes shake { 0%,100% { transform:none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes flipIn { from { opacity:0; transform: rotateX(90deg); } to { opacity:1; transform:none; } }
  @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
  .pop-in { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .ltr { display:inline-block; animation: letterIn .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 45ms + .1s); }
  .intro-icon { animation: iconIn .9s cubic-bezier(.2,.9,.3,1.2) both; }
  .intro-body { animation: rise .6s ease-out both; animation-delay: .7s; }
  .intro-extra { animation: rise .6s ease-out both; animation-delay: .45s; }
  .intro-btn { animation: rise .5s ease-out both; animation-delay: 1.1s; }
  .just-died { animation: die 1.4s ease-out both; }
  .vc-pop { animation: pop .4s cubic-bezier(.2,.9,.3,1.4) both; }
  .victim { animation: dieBig 1.8s ease-out .6s both; }
  .saved { animation: shield 1.6s ease-in-out .6s 3; }
  .role-flip { animation: flipIn .6s ease-out both; animation-delay: 1.9s; }
  .shake { animation: shake .35s ease-in-out; }
  .msg-in { animation: rise .35s ease-out both; }
  .sleep span { display:inline-block; animation: zzz 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .5s); }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  @media (max-width: 1023px) {
    [data-tab] { display: none !important; }
    body.tab-game [data-tab="game"] { display: block !important; }
    body.tab-chat [data-tab="chat"] { display: flex !important; }
    body.tab-log [data-tab="log"] { display: block !important; }
  }
  .tabbtn[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
</style>
</head>

function buildRoles(n, s) {
  let mafia = n <= 5 ? 1 : n <= 8 ? 2 : n <= 11 ? 3 : Math.floor(n / 3.5);
  const roles = [];
  if (s.don && mafia >= 2) { roles.push('don'); mafia--; }
  for (let i = 0; i < mafia; i++) roles.push('mafia');
  if (s.detective) roles.push('detective');
  if (s.doctor && n >= 5) roles.push('doctor');
  while (roles.length < n) roles.push('villager');
  return shuffle(roles);
}

      <button class="btn btn-ghost btn-sm" data-home="test">${tE('home.test')}</button>
      <button class="btn btn-ghost btn-sm" data-home="help">${tE('home.help')}</button>
    </div>
  </div>`;
  const form = $('#homeForm');
  const shakeEl = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); };
  const getName = () => { const el = $('#nameInput'), v = el.value.trim(); if (!v) { shakeEl(el); toast(t('home.enterName')); } return v; };
  const busy = (btn, text) => { if (btn) { btn.disabled = true; btn.textContent = text; } };
  const doJoin = async btn => {
    const name = getName(); if (!name) return;
    const code = $('#codeInput').value.trim().toUpperCase();
    if (code.length !== 6) { shakeEl($('#codeInput')); toast(t('home.codeLen')); return; }
    busy(btn, t('home.joining'));
    try { await joinRoom(code, name); } catch (err) { console.error(err); renderHome(invited ? code : '', typeof err === 'string' ? err : t('err.join')); }
  };
  const doCreate = async (btn, test) => {
    const name = test ? ($('#nameInput').value.trim() || (LANG === 'hy' ? 'Փորձող' : 'Tester')) : getName(); if (!name) return;
    busy(btn, t(test ? 'home.bots' : 'home.creating'));
    try { await createRoom(name, test ? 8 : 10, { test }); } catch (err) { console.error(err); renderHome('', t('err.create')); }
  };
  form.onsubmit = e => { e.preventDefault(); const code = $('#codeInput')?.value.trim(); (invited || code) ? doJoin(form.querySelector('[data-home=join]')) : doCreate(form.querySelector('[data-home=create]')); };
  $('#app').querySelectorAll('[data-home]').forEach(b => b.onclick = e => {
    e.preventDefault();
    const a = b.dataset.home;
    if (a === 'join') doJoin(b);
    if (a === 'create') doCreate(b, false);
    if (a === 'test') doCreate(b, true);
    if (a === 'help') showHelp();
    if (a === 'forget') { history.replaceState(null, '', location.pathname); renderHome(); }
  });
}

function makeBots(count, takenNames, start) {
  const out = {}, taken = new Set(takenNames.map(n => n.toLowerCase()));
  shuffle(BOT_NAMES[LANG]).filter(n => !taken.has(n.toLowerCase())).slice(0, Math.max(0, count)).forEach((n, i) => {
    out['bot_' + Math.random().toString(36).slice(2, 9)] = { name: n, joinedAt: start + i, online: true, alive: true, bot: true };
  });
  return out;
}
async function createRoom(name, maxPlayers, { test = false } = {}) {
  S.name = name; localStorage.setItem('nf_name', name);
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  for (let tries = 0; tries < 8; tries++) {
    code = Array.from({ length: 6 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
    if (!(await db.ref('rooms/' + code + '/hostId').once('value')).exists()) break;
  }
  const settings = { ...DEFAULT_SETTINGS, maxPlayers };
  let players = { [S.pid]: { name, joinedAt: TS, online: true, alive: true } };
  const log = { [newKey()]: { t: Date.now(), k: 'open', v: { name }, type: 'info' } };
  if (test) {
    Object.assign(settings, { test: true, nightTime: 15, dayTime: 20, speakTime: 15, voteTime: 15 });
    players = { ...players, ...makeBots(5, [name], Date.now() + 5000) };
    log[newKey()] = { t: Date.now() + 1, k: 'test', v: {}, type: 'info' };
  }
  await db.ref('rooms/' + code).set({ hostId: S.pid, createdAt: TS, status: 'lobby', gameId: 0, settings, phase: { name: 'lobby', round: 0, endsAt: 0 }, players, log });
  enterRoom(code);
}
async function joinRoom(code, name) {
  S.name = name; localStorage.setItem('nf_name', name);
  const snap = await db.ref('rooms/' + code).once('value');
  if (!snap.exists()) throw t('err.noRoom');
  const room = snap.val();
  if (room.players?.[S.pid]?.name) {
    if (room.status === 'lobby' && room.players[S.pid].name !== name) await db.ref(`rooms/${code}/players/${S.pid}/name`).set(name);
    return enterRoom(code);
  }
  if (room.status !== 'lobby') { toast(t('toast.spectating'), 4000); return enterRoom(code); }
  let reason = '';
  const res = await db.ref(`rooms/${code}/players`).transaction(ps => {
    ps = ps || {};
    const list = Object.values(ps).filter(p => p && p.name);
    if (list.length >= (room.settings?.maxPlayers || 10)) { reason = t('err.full'); return; }
    if (list.some(p => p.name.toLowerCase() === name.toLowerCase())) { reason = t('err.nameTaken'); return; }
    ps[S.pid] = { name, joinedAt: Date.now(), online: true, alive: true };
    return ps;
  });
  if (!res.committed) throw reason || t('err.join');
  enterRoom(code);
}

/* =====================================================================
   6. ROOM CONNECTION
   ===================================================================== */
function detach() {
  leaveCall();
  [S.roomRef, S.chatRef, S.connRef, S.reactRef, S.peersRef].forEach(r => r && r.off());
  Object.assign(S, { roomRef: null, chatRef: null, connRef: null, reactRef: null, peersRef: null, room: null, code: null, chat: [], lastPhaseKey: null, lastTurnKey: '', prevMe: null, prevSeat: {}, wasMember: false, viewId: null, revealAll: false, testOpen: false, callPeers: {} });
  S.seenLobby = new Set(); S.seenLog = new Set();
  hideModal(); renderTestDock();
}
function enterRoom(code) {
  detach();
  S.code = code; S.enterAt = now();
  history.replaceState(null, '', `${location.pathname}?room=${code}`);
  renderRoomShell();
  S.roomRef = db.ref('rooms/' + code);
  S.roomRef.on('value', snap => {
    if (!snap.exists()) { detach(); history.replaceState(null, '', location.pathname); renderHome('', t('err.closed')); return; }
    S.room = snap.val(); onRoomUpdate();
  });
  S.chatRef = db.ref('chats/' + code).limitToLast(200);
  S.chatRef.on('child_added', snap => {
    const m = { id: snap.key, ...snap.val() };
    S.chat.push(m);
    if (m.t > S.enterAt - 1000 && m.pid !== getMe()?.id && canSee(m)) {
      Sound.play('msg');
      if (S.tab !== 'chat' && innerWidth < 1024) { S.unread++; updateTabs(); }
    }
    renderChat();
  });
  S.reactRef = db.ref('reactions/' + code).limitToLast(20);
  S.reactRef.on('child_added', snap => {
    const m = snap.val();
    if (m && m.t > now() - 5000 && m.t > S.enterAt - 1000 && canSee(m)) { spawnFloater(m.e, m.name); Sound.play('pop'); }
  });
  S.peersRef = db.ref(`rtc/${code}/peers`);
  S.peersRef.on('value', snap => { S.callPeers = snap.val() || {}; syncPeers(); renderCallBar(); });
  S.connRef = db.ref('.info/connected');
  S.connRef.on('value', s => { S.connected = s.val() === true; if (S.connected) markOnline(); });
}
async function markOnline() {
  if (!S.code) return;
  const pref = db.ref(`rooms/${S.code}/players/${S.pid}`);
  if (!(await pref.child('name').once('value')).exists()) return;
  await pref.child('online').onDisconnect().set(false);
  await pref.child('online').set(true);
}
async function leaveRoom() {
  const r = S.room, code = S.code;
  if (r && code) {
    const pref = db.ref(`rooms/${code}/players/${S.pid}`);
    await pref.child('online').onDisconnect().cancel();
    if (r.status === 'lobby') {
      const others = plist(r).filter(p => p.id !== S.pid && !p.bot);
      if (r.hostId === S.pid && others.length) await db.ref(`rooms/${code}/hostId`).set((others.find(p => p.online) || others[0]).id);
      await pref.remove();
    } else if (r.players?.[S.pid]) await pref.child('online').set(false);
  }
  detach();
  history.replaceState(null, '', location.pathname);
  renderHome();

/* =====================================================================
   7. VOICE & VIDEO (WebRTC mesh, Firebase signalling)
   ===================================================================== */
const Call = { joined: false, video: false, stream: null, pcs: {}, tiles: {}, micOn: true, camOn: true, sigRef: null, presRef: null, actx: null, analysers: {}, meter: null };
const callBase = () => db.ref(`rtc/${S.code}`);

// Game rules decide who hears/sees whom. Enforced on the listener's side and by muting your own mic.
function canHear(fromId) {
  const r = S.room; if (!r || r.status !== 'playing') return true;
  const me = realMe(), p = r.players?.[fromId];
  if (!me || !me.alive) return true;
  if (!p || !p.alive) return false;
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' && teamOf(p.role) === 'mafia';
  const sp = curSpeaker(r);
  if (sp) return fromId === sp;
  return true;
}
function canSeeCall(fromId) {
  const r = S.room; if (!r || r.status !== 'playing') return true;
  const me = realMe(), p = r.players?.[fromId];
  if (!me || !me.alive) return true;
  if (!p || !p.alive) return false;
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' && teamOf(p.role) === 'mafia';
  return true;
}
function micState() {
  const r = S.room, me = realMe();
  if (!r || r.status !== 'playing' || !me) return { on: true };
  if (!me.alive) return { on: true, note: 'call.mutedGhost' };
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' ? { on: true } : { on: false, note: 'call.mutedNight' };
  const sp = curSpeaker(r);
  if (sp && sp !== me.id) return { on: false, note: 'call.mutedTurn' };
  return { on: true };
}
function camAllowed() { const r = S.room, me = realMe(); return !(r?.status === 'playing' && me?.alive && r.phase.name === 'night' && teamOf(me.role) !== 'mafia'); }

async function joinCall(withVideo) {
  if (Call.joined) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) { toast(t('call.insecure'), 5000); return; }
  try {
    Call.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: withVideo ? { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' } : false });
  } catch (e) { console.error(e); toast(t('call.denied'), 5000); return; }
  Call.joined = true; Call.video = withVideo; Call.micOn = true; Call.camOn = true;
  const base = callBase();
  await base.child('sig/' + S.pid).remove();
  Call.sigRef = base.child('sig/' + S.pid);
  Call.sigRef.on('child_added', snap => { const m = snap.val(); base.child(`sig/${S.pid}/${snap.key}`).remove(); handleSignal(m).catch(console.error); });
  Call.presRef = base.child('peers/' + S.pid);
  await Call.presRef.onDisconnect().remove();
  await Call.presRef.set({ name: realMe()?.name || S.name, video: withVideo, mic: true, t: TS });
  addTile(S.pid, Call.stream, true);
  startMeter();
  syncPeers(); applyCallRules(); renderCallBar();
}
function leaveCall() {
  if (!Call.joined) { Object.values(Call.tiles).forEach(el => el.remove()); Call.tiles = {}; return; }
  Call.joined = false;
  Object.keys(Call.pcs).forEach(closePC);
  Call.stream?.getTracks().forEach(tr => tr.stop()); Call.stream = null;
  Call.sigRef?.off(); Call.sigRef = null;
  if (Call.presRef) { Call.presRef.onDisconnect().cancel(); Call.presRef.remove(); Call.presRef = null; }
  Object.values(Call.tiles).forEach(el => el.remove()); Call.tiles = {}; Call.analysers = {};
  clearInterval(Call.meter);
  renderCallBar();
}
function syncPeers() {
  if (!Call.joined) return;
  const peers = S.callPeers || {};
  for (const [id, info] of Object.entries(peers)) {
    if (id === S.pid) continue;
    const e = Call.pcs[id];
    if (e && e.t !== info.t) closePC(id);
    if (!Call.pcs[id]) { createPC(id, info.t); if (S.pid < id) makeOffer(id); }
  }
  for (const id of Object.keys(Call.pcs)) if (!peers[id]) closePC(id);
  applyCallRules();
}
function createPC(id, stamp) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  Call.stream.getTracks().forEach(tr => pc.addTrack(tr, Call.stream));
  pc.onicecandidate = e => { if (e.candidate) sendSig(id, { type: 'ice', c: e.candidate.toJSON() }); };
  pc.ontrack = e => addTile(id, e.streams[0] || new MediaStream([e.track]), false);
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && S.pid < id) makeOffer(id, true); };
  Call.pcs[id] = { pc, ice: [], t: stamp };
  return Call.pcs[id];
}
function closePC(id) {
  const e = Call.pcs[id]; if (!e) return;
  try { e.pc.close(); } catch {}
  delete Call.pcs[id]; delete Call.analysers[id];
  Call.tiles[id]?.remove(); delete Call.tiles[id];
}
async function makeOffer(id, iceRestart = false) {
  const e = Call.pcs[id]; if (!e) return;
  const offer = await e.pc.createOffer({ iceRestart });
  await e.pc.setLocalDescription(offer);
  sendSig(id, { type: 'offer', sdp: offer.sdp });
}
function sendSig(to, msg) { return callBase().child('sig/' + to).push({ ...msg, from: S.pid, t: TS }); }
async function handleSignal(m) {
  if (!Call.joined || !m?.from) return;
  const e = Call.pcs[m.from] || createPC(m.from, S.callPeers[m.from]?.t);
  const pc = e.pc;
  if (m.type === 'offer') {
    await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
    for (const c of e.ice.splice(0)) await pc.addIceCandidate(c).catch(() => {});
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
    sendSig(m.from, { type: 'answer', sdp: ans.sdp });
  } else if (m.type === 'answer') {
    if (pc.signalingState === 'have-local-offer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
      for (const c of e.ice.splice(0)) await pc.addIceCandidate(c).catch(() => {});
    }
  } else if (m.type === 'ice') {
    if (pc.remoteDescription) await pc.addIceCandidate(m.c).catch(() => {}); else e.ice.push(m.c);
  }
}
function addTile(id, stream, self) {
  let el = Call.tiles[id];
  if (!el) {
    el = document.createElement('div');
    el.className = 'tile pop-in' + (self ? ' self' : '');
    el.innerHTML = `<video autoplay playsinline ${self ? 'muted' : ''}></video><div class="tile-av"></div><div class="tile-sleep">😴</div><div class="tile-name"></div>`;
    Call.tiles[id] = el;
    $('#tiles')?.appendChild(el);
  }
  const v = el.querySelector('video');
  if (v.srcObject !== stream) { v.srcObject = stream; v.play().catch(() => {}); }
  el.classList.toggle('has-video', stream.getVideoTracks().length > 0);
  if (!self && stream.getAudioTracks().length) attachMeter(id, stream);
  if (self) attachMeter(id, stream);
  applyCallRules();
}
function attachMeter(id, stream) {
  try {
    Call.actx = Call.actx || new (window.AudioContext || window.webkitAudioContext)();
    if (Call.analysers[id]?.stream === stream) return;
    const src = Call.actx.createMediaStreamSource(stream), an = Call.actx.createAnalyser();
    an.fftSize = 256; src.connect(an);
    Call.analysers[id] = { an, stream, buf: new Uint8Array(an.frequencyBinCount) };
  } catch {}
}
function startMeter() {
  clearInterval(Call.meter);
  Call.meter = setInterval(() => {
    for (const [id, a] of Object.entries(Call.analysers)) {
      a.an.getByteFrequencyData(a.buf);
      const avg = a.buf.reduce((s, x) => s + x, 0) / a.buf.length;
      const audible = id === S.pid ? (Call.micOn && micState().on) : canHear(id);
      Call.tiles[id]?.classList.toggle('talking', audible && avg > 18);
    }
  }, 180);
}
function applyCallRules() {
  if (Call.stream) {
    const ms = micState();
    Call.stream.getAudioTracks().forEach(tr => tr.enabled = Call.micOn && ms.on);
    Call.stream.getVideoTracks().forEach(tr => tr.enabled = Call.camOn && camAllowed());
  }
  for (const [id, el] of Object.entries(Call.tiles)) {
    const self = id === S.pid, v = el.querySelector('video');
    if (!self) v.muted = !canHear(id);
    el.classList.toggle('blocked', self ? !camAllowed() : !canSeeCall(id));
    const p = S.room?.players?.[id], info = S.callPeers[id] || {};
    const nm = p?.name || info.name || '?';
    el.querySelector('.tile-av').innerHTML = avatar(nm, 'avatar-lg');
    el.querySelector('.tile-name').textContent = `${info.mic === false ? '🔇 ' : ''}${nm}${self ? ' ' + t('you') : ''}`;
    if (!el.isConnected) $('#tiles')?.appendChild(el);
  }
}
async function toggleMic() { Call.micOn = !Call.micOn; applyCallRules(); Call.presRef?.update({ mic: Call.micOn }); renderCallBar(); }
function toggleCam() { Call.camOn = !Call.camOn; applyCallRules(); renderCallBar(); }

function renderCallBar() {
  const bar = $('#callControls'); if (!bar) return;
  const n = Object.keys(S.callPeers || {}).length;
  const names = Object.values(S.callPeers || {}).map(p => p.name).slice(0, 4).join(', ');
  const ms = micState();
  $('#callInfo').textContent = n ? `${t('call.inCall', { n })}${names ? ': ' + names : ''}` : t('call.nobody');
  bar.innerHTML = Call.joined ? `
    <button class="btn btn-ghost btn-icon ${Call.micOn ? 'btn-on' : ''}" data-call="mic" title="${tE('call.mic')}" aria-pressed="${Call.micOn}">${Call.micOn ? '🎙️' : '🔇'}</button>
    ${Call.video ? `<button class="btn btn-ghost btn-icon ${Call.camOn ? 'btn-on' : ''}" data-call="cam" title="${tE('call.cam')}" aria-pressed="${Call.camOn}">${Call.camOn ? '📹' : '🚫'}</button>` : ''}
    <button class="btn btn-danger btn-sm" data-call="leave">${tE('call.leave')}</button>` : `
    <button class="btn btn-ghost btn-sm" data-call="voice">${tE('call.voice')}</button>
    <button class="btn btn-ghost btn-sm" data-call="video">${tE('call.video')}</button>`;
  const note = $('#callNote');
  note.textContent = Call.joined ? (ms.note ? t(ms.note) : (Call.micOn ? '🟢 ' + t('call.live') : '')) : '';
  $('#tiles').classList.toggle('hidden', !Call.joined && !Object.keys(Call.tiles).length);
}

/* =====================================================================
   8. HOST ENGINE (+ bots)
   ===================================================================== */
function roomTx(fn) { return S.roomRef.transaction(cur => { if (!cur) return cur; const out = fn(cur); return out === undefined ? undefined : out; }); }
let logSeq = 0;
function addLog(r, k, v = {}, type = 'info') { r.log = r.log || {}; r.log[newKey()] = { t: now() + (++logSeq % 1000) / 1000, k, v, type }; }
function winnerOf(r) {
  const alive = Object.values(r.players || {}).filter(p => p && p.name && p.alive);
  const m = alive.filter(p => teamOf(p.role) === 'mafia').length;
  if (m === 0) return 'town';
  if (m >= alive.length - m) return 'mafia';
  return null;
}
function finishPhase(r, next) {
  const w = winnerOf(r);
  if (w) { r.status = 'ended'; r.winner = w; r.phase = { name: 'ended', round: r.phase.round, endsAt: 0 }; addLog(r, w === 'town' ? 'townWin' : 'mafiaWin', {}, 'end'); }
  else r.phase = next;
  return r;
}
function nightComplete(r) {
  const n = r.night?.[r.phase.round] || {};
  return plist(r).filter(p => p.alive).every(p =>
    !(teamOf(p.role) === 'mafia' && !n.kill?.[p.id]) && !(p.role === 'don' && !n.donCheck?.[p.id]) &&
    !(p.role === 'doctor' && !n.heal?.[p.id]) && !(p.role === 'detective' && !n.check?.[p.id]));
}
function voteComplete(r) { const v = r.votes?.[r.phase.round] || {}; return plist(r).filter(p => p.alive).every(p => v[p.id]); }

async function engineTick() {
  const r = S.room;
  if (!r || r.status !== 'playing' || S.engineBusy || !isHost()) return;
  S.engineBusy = true;
  try {
    const ph = r.phase, tm = now();
    const done = ph.name === 'night' ? nightComplete(r) : ph.name === 'vote' ? voteComplete(r) : false;
    if (ph.name === 'day' && ph.turn) {
      if (tm >= ph.endsAt || ph.turn.done === ph.turn.idx) await nextSpeaker(ph.round, ph.turn.idx);
      else if (plist(r).some(p => p.bot)) await botTick(r);
    } else if (done && ph.endsAt - tm > 5000) {
      await roomTx(x => (x.phase.name === ph.name && x.phase.round === ph.round) ? (x.phase.endsAt = now() + 5000, x) : undefined);
    } else if (tm >= ph.endsAt) {
      if (ph.name === 'night') await resolveNight(ph.round);
      else if (ph.name === 'day') await startVote(ph.round);
      else if (ph.name === 'vote') await resolveVote(ph.round);
    } else if (plist(r).some(p => p.bot)) await botTick(r);
  } catch (e) { console.error(e); }
  finally { S.engineBusy = false; }
}

function botSay(r, bot, text, ch = 'all') { return db.ref('chats/' + S.code).push({ pid: bot.id, name: bot.name, text, t: TS, ch, g: r.gameId || 0 }); }
const botLine = (kind, x) => rnd(BOT_LINES[LANG][kind]).replace('{x}', x);
async function botTick(r) {
  const ph = r.phase, round = ph.round, key = `${r.gameId}-${ph.name}-${round}`;
  const elapsed = durOf(r, ph.name) - (ph.endsAt - now());
  const alive = plist(r).filter(p => p.alive);
  const rush = S.botRush === key || (ph.turn && S.botRush === key + '-' + ph.turn.idx);
  const controlled = r.settings?.test ? S.viewId : null;
  const bots = alive.filter(p => p.bot && p.id !== controlled);
  const n = r.night?.[round] || {}, votes = r.votes?.[round] || {};
  const up = {};
  const knownMafia = b => Object.values(r.private?.[b.id] || {}).find(x => x.kind === 'det' && x.yes && r.players[x.target]?.alive)?.target;
  if (ph.name === 'day' && ph.turn) {
    const sp = curSpeaker(r), b = bots.find(x => x.id === sp);
    if (b) {
      const ck = `${key}-${ph.turn.idx}`;
      if (!S.botChatted.has(ck) && (elapsed > 1500 || rush)) {
        S.botChatted.add(ck);
        const found = knownMafia(b);
        const target = found ? r.players[found] : rnd(alive.filter(p => p.id !== b.id && (teamOf(b.role) !== 'mafia' || teamOf(p.role) !== 'mafia')));
        if (target) botSay(r, b, botLine(found ? 'det' : 'town', target.name));
      }
      if (elapsed > 5000 || rush) up['phase/turn/done'] = ph.turn.idx;
    }
    if (Object.keys(up).length) await S.roomRef.update(up);
    return;
  }
  for (const b of bots) {
    const delay = rush ? 0 : 1500 + hashNum(b.id + key) % 6000;
    if (elapsed < delay) continue;
    const others = alive.filter(p => p.id !== b.id), nonMafia = alive.filter(p => teamOf(p.role) !== 'mafia');
    if (ph.name === 'night') {
      if (teamOf(b.role) === 'mafia' && !n.kill?.[b.id]) {
        const mate = Object.entries(n.kill || {}).find(([v, tg]) => v !== b.id && r.players[tg]?.alive)?.[1];
        const pick = mate && Math.random() < .75 ? mate : rnd(nonMafia)?.id;
        if (pick) { up[`night/${round}/kill/${b.id}`] = pick; if (Math.random() < .5) botSay(r, b, botLine('mafia', nameOf(r, pick)), 'mafia'); }
      }
      if (b.role === 'don' && !n.donCheck?.[b.id]) { const p = rnd(nonMafia); if (p) up[`night/${round}/donCheck/${b.id}`] = p.id; }
      if (b.role === 'doctor' && !n.heal?.[b.id]) up[`night/${round}/heal/${b.id}`] = Math.random() < .3 ? b.id : rnd(alive).id;
      if (b.role === 'detective' && !n.check?.[b.id]) {
        const checked = Object.values(r.private?.[b.id] || {}).map(x => x.target);
        const p = rnd(others.filter(x => !checked.includes(x.id))); if (p) up[`night/${round}/check/${b.id}`] = p.id;
      }
    } else if (ph.name === 'day') {
      const ck = `${key}-${b.id}`;
      if (!S.botChatted.has(ck) && elapsed > delay + hashNum(ck) % 6000) {
        S.botChatted.add(ck);
        const found = knownMafia(b);
        const target = found ? r.players[found] : rnd(teamOf(b.role) === 'mafia' ? nonMafia.filter(p => p.id !== b.id) : others);
        if (target && Math.random() < .85) botSay(r, b, botLine(found ? 'det' : 'town', target.name));
      }
    } else if (ph.name === 'vote' && !votes[b.id]) {
      const tally = {}; Object.entries(votes).forEach(([v, tg]) => { if (r.players[v]?.alive && tg !== 'skip') tally[tg] = (tally[tg] || 0) + 1; });
      const leader = Object.keys(tally).sort((a, c) => tally[c] - tally[a])[0];
      const found = knownMafia(b);
      let pick;
      if (found) pick = found;
      else if (teamOf(b.role) === 'mafia') pick = (leader && teamOf(r.players[leader]?.role) !== 'mafia' && leader !== b.id) ? leader : rnd(nonMafia.filter(p => p.id !== b.id))?.id;
      else if (Math.random() < .12) pick = 'skip';
      else if (leader && leader !== b.id && Math.random() < .5) pick = leader;
      else pick = rnd(others)?.id;
      if (pick) up[`votes/${round}/${b.id}`] = pick;
    }
  }
  if (Object.keys(up).length) await S.roomRef.update(up);
}
async function addBots(count) {
  if (S.room?.status !== 'lobby') return;
  const max = S.room.settings.maxPlayers;
  await S.roomRef.child('players').transaction(ps => {
    ps = ps || {};
    const list = Object.values(ps).filter(p => p && p.name);
    Object.assign(ps, makeBots(Math.min(count, max - list.length), list.map(p => p.name), Date.now()));
    return ps;
  });
}
async function removeBots() { const up = {}; plist(S.room).filter(p => p.bot).forEach(p => up['players/' + p.id] = null); if (Object.keys(up).length) await S.roomRef.update(up); }

async function startGame() {
  const res = await roomTx(r => {
    if (r.status !== 'lobby') return;
    for (const [id, p] of Object.entries(r.players || {})) if (!p || !p.name || !p.online) delete r.players[id];
    const ids = Object.keys(r.players).sort((a, b) => (r.players[a].joinedAt || 0) - (r.players[b].joinedAt || 0));
    if (ids.length < MIN_PLAYERS) return;
    const roles = buildRoles(ids.length, r.settings);
    ids.forEach((id, i) => { const p = r.players[id]; p.role = roles[i]; p.alive = true; delete p.diedAt; });
    delete r.night; delete r.votes; delete r.private; delete r.lastNight; delete r.lastVote; delete r.winner;
    r.status = 'playing'; r.gameId = Date.now(); r.log = {};
    addLog(r, 'start', { n: ids.length }, 'phase');
    addLog(r, 'night', { n: 1 }, 'phase');
    r.phase = { name: 'night', round: 1, endsAt: now() + r.settings.nightTime * 1000 + 6000 };
    return r;
  });
  if (!res.committed) toast(t('needPlayers', { n: MIN_PLAYERS }));
}
function dayPhase(r, round) {
  if (!r.settings.turns) return { name: 'day', round, endsAt: now() + r.settings.dayTime * 1000 + 4000 };
  const ids = plist(r).filter(p => p.alive).map(p => p.id);
  const k = ids.length ? (round - 1) % ids.length : 0;
  return { name: 'day', round, endsAt: now() + 7000, turn: { order: [...ids.slice(k), ...ids.slice(0, k)], idx: -1 } };
}
async function resolveNight(round) {
  await roomTx(r => {
    if (r.status !== 'playing' || r.phase.name !== 'night' || r.phase.round !== round) return;
    const P = r.players, alive = id => P[id]?.name && P[id].alive, n = r.night?.[round] || {};
    const tally = {};
    for (const [voter, target] of Object.entries(n.kill || {})) if (alive(voter) && teamOf(P[voter].role) === 'mafia' && alive(target)) tally[target] = (tally[target] || 0) + 1;
    let victim = null;
    const max = Math.max(0, ...Object.values(tally));
    if (max > 0) {
      const top = Object.keys(tally).filter(k => tally[k] === max);
      const donId = Object.keys(n.kill || {}).find(v => P[v]?.role === 'don' && alive(v));
      victim = (donId && top.includes(n.kill[donId])) ? n.kill[donId] : rnd(top);
    }
    let healed = null;
    for (const [d, tg] of Object.entries(n.heal || {})) if (alive(d) && P[d].role === 'doctor' && alive(tg)) healed = tg;
    r.private = r.private || {};
    for (const [d, tg] of Object.entries(n.check || {})) if (alive(d) && P[d].role === 'detective' && P[tg]) { r.private[d] = r.private[d] || {}; r.private[d][round] = { target: tg, kind: 'det', yes: teamOf(P[tg].role) === 'mafia' }; }
    for (const [d, tg] of Object.entries(n.donCheck || {})) if (alive(d) && P[d].role === 'don' && P[tg]) { r.private[d] = r.private[d] || {}; r.private[d][round] = { target: tg, kind: 'don', yes: P[tg].role === 'detective' }; }
    const saved = !!victim && healed === victim;
    addLog(r, 'day', { n: round }, 'phase');
    if (victim && !saved) {
      P[victim].alive = false; P[victim].diedAt = { round, how: 'night' };
      addLog(r, 'killed', { name: P[victim].name, role: r.settings.reveal ? P[victim].role : '' }, 'death');
    } else if (saved) addLog(r, 'saved', { name: P[victim].name }, 'save');
    else addLog(r, 'quiet', {}, 'info');
    r.lastNight = { round, victim: saved ? null : victim, saved: saved ? victim : null, role: (victim && !saved && r.settings.reveal) ? P[victim].role : null };
    return finishPhase(r, dayPhase(r, round));
  });
}
async function nextSpeaker(round, idx) {
  await roomTx(r => {
    const ph = r.phase;
    if (r.status !== 'playing' || ph.name !== 'day' || ph.round !== round || !ph.turn || ph.turn.idx !== idx) return;
    const P = r.players; let i = idx + 1;
    while (i < ph.turn.order.length && !(P[ph.turn.order[i]]?.alive && P[ph.turn.order[i]].online)) i++;
    if (i >= ph.turn.order.length) {
      addLog(r, 'voteOpen', { n: round }, 'phase');
      r.phase = { name: 'vote', round, endsAt: now() + r.settings.voteTime * 1000 + 2000 };
    } else { ph.turn.idx = i; delete ph.turn.done; ph.endsAt = now() + (r.settings.speakTime || 45) * 1000; }
    return r;
  });
}
async function startVote(round) {
  await roomTx(r => {
    if (r.status !== 'playing' || r.phase.name !== 'day' || r.phase.round !== round) return;
    addLog(r, 'voteOpen', { n: round }, 'phase');
    r.phase = { name: 'vote', round, endsAt: now() + r.settings.voteTime * 1000 + 2000 };
    return r;
  });
}
async function resolveVote(round) {
  await roomTx(r => {
    if (r.status !== 'playing' || r.phase.name !== 'vote' || r.phase.round !== round) return;
    const P = r.players, alive = id => P[id]?.name && P[id].alive, tally = {};
    for (const [voter, target] of Object.entries(r.votes?.[round] || {})) if (alive(voter) && (target === 'skip' || alive(target))) tally[target] = (tally[target] || 0) + 1;
    const max = Math.max(0, ...Object.values(tally)), top = Object.keys(tally).filter(k => tally[k] === max);
    let out = null, outcome;
    if (max === 0) outcome = 'none';
    else if (top.length > 1) outcome = 'tie';
    else if (top[0] === 'skip') outcome = 'skip';
    else { out = top[0]; outcome = 'out'; P[out].alive = false; P[out].diedAt = { round, how: 'vote' }; }
    const v = { outcome, name: out ? P[out].name : '', n: max, role: out && r.settings.reveal ? P[out].role : '' };
    addLog(r, 'vote', v, out ? 'death' : 'info');
    r.lastVote = { round, out, ...v };
    const res = finishPhase(r, { name: 'night', round: round + 1, endsAt: now() + r.settings.nightTime * 1000 + 4000 });
    if (res.status === 'playing') addLog(r, 'night', { n: round + 1 }, 'phase');
    return res;
  });
}
async function extendPhase(sec) { await roomTx(r => (r.status === 'playing') ? (r.phase.endsAt = Math.max(r.phase.endsAt, now()) + sec * 1000, r) : undefined); }
async function endPhaseNow() {
  const r = S.room; if (!r || r.status !== 'playing') return;
  if (r.phase.name === 'day') return startVote(r.phase.round);
  await roomTx(x => (x.phase.name === r.phase.name && x.phase.round === r.phase.round) ? (x.phase.endsAt = now(), x) : undefined);
}
async function finishTurn() { const r = S.room; if (r?.phase?.turn) await S.roomRef.child('phase/turn/done').set(r.phase.turn.idx); }
async function backToLobby() {
  await roomTx(r => {
    if (r.status === 'lobby') return;
    for (const [id, p] of Object.entries(r.players || {})) { if (!p || !p.name || !p.online) { delete r.players[id]; continue; } delete p.role; delete p.diedAt; p.alive = true; }
    delete r.night; delete r.votes; delete r.private; delete r.lastNight; delete r.lastVote; delete r.winner;
    r.status = 'lobby'; r.phase = { name: 'lobby', round: 0, endsAt: 0 }; r.log = {};
    addLog(r, 'lobby', {}, 'info');
    return r;
  });
}

function voteMsg(v) { let s = t('vote.' + v.outcome, { name: v.name, n: v.n }); if (v.role) s += ' ' + t('reveal', { role: roleText(v.role) }); return s; }
function announce(r, me, wasAlive) {
  const ph = r.phase.name, round = r.phase.round;
  if (ph === 'lobby') { hideModal(); return; }
  if (ph === 'night' && round === 1 && me) { Sound.play('night'); vibrate(80); showRoleCard(true); return; }
  const iDied = !!(me && wasAlive && !me.alive);
  let icon, title, body = '', extra = '', sound = ph, auto = 9000;
  if (ph === 'night') {
    icon = '🌙'; title = t('ph.night', { n: round });
    const lv = r.lastVote || {};
    if (lv.out) { extra = victimBlock(r, lv.out, lv.role, 'vote'); sound = 'death'; }
    body = `${lv.outcome ? esc(voteMsg(lv)) : ''}<p class="muted mt-2">${tE('an.night')}</p>`;
  } else if (ph === 'day') {
    icon = '☀️'; title = t('ph.day', { n: round }); auto = r.phase.turn ? 6500 : 9000;
    const ln = r.lastNight || {};
    if (ln.victim) { extra = victimBlock(r, ln.victim, ln.role, 'dead'); body = tE('an.killed'); sound = 'death'; }
    else if (ln.saved) { extra = victimBlock(r, ln.saved, null, 'saved'); body = tE('an.saved'); sound = 'save'; }
    else body = tE('an.quiet');
    if (r.phase.turn) body += `<p class="muted text-sm mt-2">🎤 ${tE('an.turns', { s: r.settings.speakTime })}</p>`;
    const pr = me && r.private?.[me.id]?.[round];
    if (pr) body += `<div class="panel-soft mt-4 p-3 text-sm text-left">${privateHTML(r, pr)}</div>`;
  } else if (ph === 'vote') {
    icon = '🗳️'; title = t('an.voteT'); body = tE('an.voteD'); auto = 3500;

function getAction(r, me) {

  if (ph.name === 'night') {

    if (me.role === 'doctor') return { kind: 'heal', path: `night/${round}/heal/${me.id}`, current: n.heal?.[me.id], can: p => p.alive, k: 'act.heal' };

async function onMainClick(e) {
  const r = S.room, me = getMe(); if (!r) return;
  const tg = e.target.closest('[data-act],[data-pick],[data-kick],[data-don]'); if (!tg) return;
  if (tg.dataset.don) { S.donMode = tg.dataset.don; Sound.play('pick'); renderMain(); return; }
  if (tg.dataset.kick) {
    const p = r.players[tg.dataset.kick];
    if (p?.bot || confirm(t('kick', { name: p?.name || '?' }))) await S.roomRef.child('players/' + tg.dataset.kick).remove();
    return;
  }
  if (tg.dataset.pick) {
    const act = getAction(r, me); if (!act) return;
    const target = tg.dataset.pick;
    if (target !== 'skip' && !(r.players[target] && act.can({ id: target, ...r.players[target] }))) return;
    Sound.play('pick'); vibrate(25);
    const ref = S.roomRef.child(act.path);
    if (act.current === target) await ref.remove(); else await ref.set(target);
    return;
  }
  const a = tg.dataset.act, link = `${location.origin}${location.pathname}?room=${S.code}`;
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(link); tg.textContent = t('copied'); Sound.play('pick'); setTimeout(() => { if (tg.isConnected) tg.textContent = t('copy'); }, 1600); }
    catch { prompt(t('copy'), link); }
  }
  if (a === 'share') navigator.share({ title: 'Nightfall', text: t('shareText', { code: S.code }), url: link }).catch(() => {});
  if (a === 'qr') showQR();
  if (a === 'start') { tg.disabled = true; tg.textContent = t('shuffling'); await startGame(); }
  if (a === 'endnow') await endPhaseNow();
  if (a === 'next' || a === 'done') await finishTurn();
  if (a === 'extend') { await extendPhase(30); toast(t('added30')); }
  if (a === 'lobby') await backToLobby();
  if (a === 'gochat') { S.tab = 'chat'; S.unread = 0; updateTabs(); scrollChat(true); $('#chatInput').focus(); }
  if (a === 'addbot') await addBots(1);
  if (a === 'fillbots') await addBots(99);
  if (a === 'clearbots') await removeBots();
  if (a === 'seat') {
    const name = (S.name || prompt(t('yourName')) || '').trim().slice(0, 16);
    if (name) { try { await joinRoom(S.code, name); } catch (err) { toast(typeof err === 'string' ? err : t('err.join')); } }
  }
}
async function onMainChange(e) {

/* ---------- Chat, emoji, GIFs, reactions ---------- */
function chatChannel() {
  const r = S.room, me = getMe(); if (!r) return null;
  if (!me) return r.status === 'playing' ? 'dead' : null;
  if (r.status !== 'playing') return 'all';
  if (!me.alive) return 'dead';
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' ? 'mafia' : null;
  const sp = curSpeaker(r);
  if (sp && sp !== me.id) return null;
  return 'all';
}
function reactChannel() {
  const r = S.room, me = getMe(); if (!r) return null;
  if (r.status !== 'playing') return 'all';
  if (!me) return 'dead';
  if (!me.alive) return 'dead';
  if (r.phase.name === 'night') return teamOf(me.role) === 'mafia' ? 'mafia' : null;
  return 'all';
}
function canSee(m) {
  const r = S.room, me = getMe(); if (!r) return false;
  if (m.ch === 'all' || r.status !== 'playing') return true;
  if (m.g !== r.gameId) return false;
  if (!me) return m.ch === 'dead';

}

  if (b.dataset.emoji) {
    const inp = $('#chatInput'); const st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, st) + b.dataset.emoji + inp.value.slice(en);
    inp.focus(); const pos = st + b.dataset.emoji.length; inp.setSelectionRange(pos, pos); return;
  }
  if (b.dataset.gif !== undefined) { const g = S.gifs[+b.dataset.gif]; if (g) { sendChat('GIF', g.url); closePicker(); } }
}

/* =====================================================================
   10. BOOT
   ===================================================================== */
(async function boot() {
  document.documentElement.lang = LANG;
  if (!CONFIGURED) return renderSetupNeeded();
  db.ref('.info/serverTimeOffset').on('value', s => S.offset = s.val() || 0);
  setInterval(() => { updateTimer(); engineTick(); }, 500);
  const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  if (!code) return renderHome();
  try {
    if ((await db.ref(`rooms/${code}/players/${S.pid}/name`).once('value')).exists()) return enterRoom(code);
    if (!(await db.ref(`rooms/${code}/status`).once('value')).exists()) return renderHome('', t('err.noRoom'));
    renderHome(code);
  } catch (e) { console.error(e); renderHome(code, t('err.db')); }
})();
</script>
</body>
